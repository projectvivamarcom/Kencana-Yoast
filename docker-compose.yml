version: '3.8'

services:
  # 1. Kencana Public Website (Nuxt 3)
  website:
    build:
      context: ./frontend/website
      dockerfile: ../../docker/Dockerfile.website
    ports:
      - "3000:3000"
    environment:
      - NUXT_PUBLIC_API_BASE=http://localhost:8080/api/v1
    depends_on:
      - seo-engine
    networks:
      - kencana-net

  # 2. Kencana Admin CMS (Vue 3)
  admin:
    build:
      context: ./frontend/admin
      dockerfile: ../../docker/Dockerfile.admin
    ports:
      - "5173:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - seo-engine
    networks:
      - kencana-net

  # 3. Kencana SEO Engine (FastAPI)
  seo-engine:
    build:
      context: ./services/seo-engine
      dockerfile: ../../docker/Dockerfile.seo-engine
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
    networks:
      - kencana-net

  # 4. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kencana_db
      POSTGRES_USER: kencana_user
      POSTGRES_PASSWORD: kencana_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - kencana-net

networks:
  kencana-net:
    driver: bridge

volumes:
  pgdata:
